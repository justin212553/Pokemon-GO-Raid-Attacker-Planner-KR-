name: Update Pokemon Data

on:
  schedule:
    # 매일 UTC 18시 (한국 시간 새벽 3시). GitHub 사정에 따라 몇 분~수십 분 늦게 실행될 수 있습니다.
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data
        run: node scripts/build-data.mjs --write

      - name: Report
        run: cat scripts/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: 포켓몬 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN 으로 push 한 커밋은 다른 workflow 를 트리거하지 않으므로 배포를 직접 호출합니다.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/static.yml
